name: ROS1 cloud acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-run-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: osrf/ros:noetic-desktop-full
      options: --privileged --shm-size=2g
    env:
      DEBIAN_FRONTEND: noninteractive
      DISPLAY: :99
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_MASTER_URI: http://localhost:11311
      ROS_HOSTNAME: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Record runner identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts logs
          {
            echo "runner_arch=$(uname -m)"
            echo "ubuntu=$(lsb_release -ds)"
            echo "ros_distro=${ROS_DISTRO:-unknown}"
            echo "commit=${GITHUB_SHA}"
          } | tee artifacts/environment.txt

      - name: Install build, simulation and recording dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-noetic-move-base ros-noetic-dwa-local-planner \
            ros-noetic-global-planner ros-noetic-map-server \
            ros-noetic-velodyne-gazebo-plugins \
            ros-noetic-pcl-ros ros-noetic-eigen-conversions \
            ros-noetic-teleop-twist-keyboard \
            build-essential cmake pkg-config \
            python3-dev python3-rospkg python3-numpy python3-scipy \
            libpcl-dev libeigen3-dev libboost-all-dev libapr1-dev \
            xvfb x11-utils ffmpeg

      - name: Build the complete catkin workspace
        shell: bash
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee logs/cloud-build.log

      - name: Start virtual display and record RViz
        shell: bash
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >logs/xvfb.log 2>&1 &
          echo $! > logs/xvfb.pid
          sleep 3
          xdpyinfo -display :99 >/dev/null
          ffmpeg -y -f x11grab -framerate 15 -video_size 1280x720 \
            -i :99 -t 210 -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            artifacts/ros1-cloud-acceptance.mp4 >logs/ffmpeg.log 2>&1 &
          echo $! > logs/ffmpeg.pid

      - name: Launch Gazebo, FAST-LIO2, map, navigation and RViz
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          roslaunch exam_fastlio fastlio_navigation.launch rviz:=true \
            >logs/fastlio-navigation.log 2>&1 &
          echo $! > logs/navigation.pid
          timeout 180 bash -c '
            until rosnode list 2>/dev/null | grep -q /laserMapping; do
              sleep 3
            done
          '
          timeout 180 bash -c '
            until rostopic list 2>/dev/null | grep -q /fastlio/cloud_registered; do
              sleep 3
            done
          '
          sleep 20

      - name: Exercise mapping, planning, control and dynamic avoidance
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash

          # Task 1: keep this motion short so Task 2 starts from a predictable,
          # open position while still visibly demonstrating forward and turn.
          timeout 8 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.12}, angular: {z: 0.0}}' || true
          timeout 5 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.0}, angular: {z: 0.45}}' || true
          timeout 6 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.12}, angular: {z: 0.0}}' || true

          # Task 2: create the obstacle before sending the goal. It starts
          # about 1.8 m ahead of the robot, leaving real free space on both
          # sides, so DWA can select and execute a collision-free bypass.
          rosrun exam_bringup obstacle_demo.py move \
            --x 4.3 --y 2.6 --axis y --range 0.4 --speed 0.12 --duration 90 \
            >logs/dynamic-obstacle.log 2>&1 &
          echo $! > logs/obstacle.pid
          sleep 3
          rostopic pub -1 /move_base_simple/goal geometry_msgs/PoseStamped \
            "{header: {frame_id: 'map'}, pose: {position: {x: 6.2, y: 2.6, z: 0.0}, orientation: {w: 1.0}}}"

          # This is an external acceptance observer only. Navigation still
          # uses FAST-LIO2, LaserScan and costmaps; Gazebo truth is never fed
          # back into localization or planning.
          timeout 95 python3 -u - <<'PY' | tee artifacts/dynamic-avoidance.json
          import json
          import math
          import pathlib
          import sys
          import time

          import rospy
          from gazebo_msgs.msg import ModelStates
          from nav_msgs.msg import Odometry

          robot = None
          obstacle = None
          obstacle_samples = 0
          closest_center = float('inf')
          closest_footprint_clearance = float('inf')
          collision_samples = 0
          max_lateral_deviation = 0.0
          max_robot_x = -float('inf')

          # The footprint below is the configured TurtleBot3 footprint plus
          # the 0.025 m costmap padding.  The temporary Gazebo box is 0.8 m
          # square.  Polygon clearance is a more faithful collision test than
          # treating both objects as circles and comparing their centres.
          ROBOT_FOOTPRINT = (
              (-0.225, -0.185),
              (0.115, -0.185),
              (0.115, 0.185),
              (-0.225, 0.185),
          )
          BOX_HALF = 0.4

          def cross(a, b, c):
              return (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0])

          def point_in_convex(point, polygon):
              values = [cross(polygon[index], polygon[(index+1) % len(polygon)], point)
                        for index in range(len(polygon))]
              return all(value >= -1e-9 for value in values) or all(value <= 1e-9 for value in values)

          def segments_intersect(a, b, c, d):
              ab_c, ab_d = cross(a, b, c), cross(a, b, d)
              cd_a, cd_b = cross(c, d, a), cross(c, d, b)
              opposite_ab = (ab_c > 1e-9 and ab_d < -1e-9) or (ab_c < -1e-9 and ab_d > 1e-9)
              opposite_cd = (cd_a > 1e-9 and cd_b < -1e-9) or (cd_a < -1e-9 and cd_b > 1e-9)
              if opposite_ab and opposite_cd:
                  return True

              def on_segment(start, end, point):
                  return (abs(cross(start, end, point)) <= 1e-9
                          and min(start[0], end[0])-1e-9 <= point[0] <= max(start[0], end[0])+1e-9
                          and min(start[1], end[1])-1e-9 <= point[1] <= max(start[1], end[1])+1e-9)

              return (on_segment(a, b, c) or on_segment(a, b, d)
                      or on_segment(c, d, a) or on_segment(c, d, b))

          def point_segment_distance(point, start, end):
              dx, dy = end[0]-start[0], end[1]-start[1]
              denominator = dx*dx + dy*dy
              if denominator <= 1e-18:
                  return math.hypot(point[0]-start[0], point[1]-start[1])
              ratio = max(0.0, min(1.0,
                  ((point[0]-start[0])*dx + (point[1]-start[1])*dy) / denominator))
              nearest = (start[0] + ratio*dx, start[1] + ratio*dy)
              return math.hypot(point[0]-nearest[0], point[1]-nearest[1])

          def polygon_clearance(first, second):
              for index in range(len(first)):
                  a, b = first[index], first[(index+1) % len(first)]
                  for other_index in range(len(second)):
                      c, d = second[other_index], second[(other_index+1) % len(second)]
                      if segments_intersect(a, b, c, d):
                          return 0.0
              if point_in_convex(first[0], second) or point_in_convex(second[0], first):
                  return 0.0
              distances = []
              for point in first:
                  distances.extend(point_segment_distance(point, second[index], second[(index+1) % len(second)])
                                   for index in range(len(second)))
              for point in second:
                  distances.extend(point_segment_distance(point, first[index], first[(index+1) % len(first)])
                                   for index in range(len(first)))
              return min(distances)

          def update_separation():
              global closest_center, closest_footprint_clearance, collision_samples
              if robot is None or obstacle is None:
                  return
              x, y, yaw = robot
              cosine, sine = math.cos(yaw), math.sin(yaw)
              robot_polygon = tuple(
                  (x + cosine*px - sine*py, y + sine*px + cosine*py)
                  for px, py in ROBOT_FOOTPRINT)
              ox, oy = obstacle
              box_polygon = (
                  (ox-BOX_HALF, oy-BOX_HALF),
                  (ox+BOX_HALF, oy-BOX_HALF),
                  (ox+BOX_HALF, oy+BOX_HALF),
                  (ox-BOX_HALF, oy+BOX_HALF),
              )
              closest_center = min(closest_center, math.hypot(x-ox, y-oy))
              clearance = polygon_clearance(robot_polygon, box_polygon)
              closest_footprint_clearance = min(closest_footprint_clearance, clearance)
              if clearance <= 1e-9:
                  collision_samples += 1

          def receive_robot(message):
              global robot, max_lateral_deviation, max_robot_x
              orientation = message.pose.pose.orientation
              yaw = 2.0 * math.atan2(orientation.z, orientation.w)
              robot = (message.pose.pose.position.x, message.pose.pose.position.y, yaw)
              max_robot_x = max(max_robot_x, robot[0])
              max_lateral_deviation = max(max_lateral_deviation, abs(robot[1] - 2.6))
              update_separation()

          def receive_models(message):
              global obstacle, obstacle_samples
              if 'exam_temporary_box' not in message.name:
                  return
              pose = message.pose[message.name.index('exam_temporary_box')]
              obstacle = (pose.position.x, pose.position.y)
              obstacle_samples += 1
              update_separation()

          rospy.init_node('verify_dynamic_bypass', anonymous=True, disable_signals=True)
          rospy.Subscriber('/odom', Odometry, receive_robot, queue_size=1)
          rospy.Subscriber('/gazebo/model_states', ModelStates, receive_models, queue_size=1)
          deadline = time.monotonic() + 90.0
          reached = False
          while not rospy.is_shutdown() and time.monotonic() < deadline:
              if robot is not None and math.hypot(robot[0]-6.2, robot[1]-2.6) <= 0.45:
                  reached = True
                  break
              time.sleep(0.1)

          result = {
              'reached_goal': reached,
              'robot_xy': robot[:2] if robot is not None else None,
              'max_robot_x': round(max_robot_x, 3),
              'max_lateral_deviation_m': round(max_lateral_deviation, 3),
              'closest_robot_obstacle_center_m': round(closest_center, 3),
              'minimum_padded_footprint_clearance_m': round(closest_footprint_clearance, 4),
              'collision_samples': collision_samples,
              'obstacle_samples': obstacle_samples,
              'passed_obstacle': max_robot_x >= 4.9,
          }
          result['passed'] = bool(
              result['reached_goal']
              and result['passed_obstacle']
              and result['max_lateral_deviation_m'] >= 0.35
              and closest_footprint_clearance > 0.0
              and result['collision_samples'] == 0
              and result['obstacle_samples'] >= 10
          )
          pathlib.Path('artifacts/dynamic-avoidance-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          if not result['passed']:
              sys.exit('FAIL: robot did not complete a verified collision-free dynamic bypass')
          PY

          kill "$(cat logs/obstacle.pid)" 2>/dev/null || true
          rosrun exam_bringup obstacle_demo.py remove || true

          roslaunch exam_fastlio exploration.launch \
            >logs/exploration.log 2>&1 &
          echo $! > logs/exploration.pid
          sleep 15
          timeout 15 rostopic echo -n 1 /exploration/status \
            | tee artifacts/exploration-status.txt

      - name: Run runtime acceptance verifier
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          {
            echo "=== ROS nodes ==="
            rosnode list
            echo
            echo "=== ROS topics ==="
            rostopic list
            echo
            echo "=== Runtime verifier ==="
            python3 verify_runtime.py
          } 2>&1 | tee artifacts/runtime-acceptance.txt

      - name: Finish recording and collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f logs/ffmpeg.pid ]]; then
            timeout 170 tail --pid="$(cat logs/ffmpeg.pid)" -f /dev/null
          fi
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash 2>/dev/null
          rosnode list >artifacts/rosnodes.txt 2>&1
          rostopic list >artifacts/rostopics.txt 2>&1
          cp upstream_versions.json artifacts/
          cp logs/*.log artifacts/ 2>/dev/null

      - name: Upload video, report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros1-cloud-acceptance
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
