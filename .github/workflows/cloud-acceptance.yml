name: ROS1 cloud acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-run-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: osrf/ros:noetic-desktop-full
      options: --privileged --shm-size=2g
    env:
      DEBIAN_FRONTEND: noninteractive
      DISPLAY: :99
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_MASTER_URI: http://localhost:11311
      ROS_HOSTNAME: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Record runner identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts logs
          {
            echo "runner_arch=$(uname -m)"
            echo "ubuntu=$(lsb_release -ds)"
            echo "ros_distro=${ROS_DISTRO:-unknown}"
            echo "commit=${GITHUB_SHA}"
          } | tee artifacts/environment.txt

      - name: Install build, simulation and recording dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-noetic-move-base ros-noetic-dwa-local-planner \
            ros-noetic-global-planner ros-noetic-map-server \
            ros-noetic-velodyne-gazebo-plugins \
            ros-noetic-pcl-ros ros-noetic-eigen-conversions \
            ros-noetic-teleop-twist-keyboard \
            build-essential cmake pkg-config \
            python3-dev python3-rospkg python3-numpy python3-scipy \
            libpcl-dev libeigen3-dev libboost-all-dev libapr1-dev \
            xvfb x11-utils ffmpeg

      - name: Build the complete catkin workspace
        shell: bash
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee logs/cloud-build.log

      - name: Start virtual display and record RViz
        shell: bash
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >logs/xvfb.log 2>&1 &
          echo $! > logs/xvfb.pid
          sleep 3
          xdpyinfo -display :99 >/dev/null
          ffmpeg -y -f x11grab -framerate 15 -video_size 1280x720 \
            -i :99 -t 210 -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            artifacts/ros1-cloud-acceptance.mp4 >logs/ffmpeg.log 2>&1 &
          echo $! > logs/ffmpeg.pid

      - name: Launch Gazebo, FAST-LIO2, map, navigation and RViz
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          roslaunch exam_fastlio fastlio_navigation.launch rviz:=true \
            >logs/fastlio-navigation.log 2>&1 &
          echo $! > logs/navigation.pid
          timeout 180 bash -c '
            until rosnode list 2>/dev/null | grep -q /laserMapping; do
              sleep 3
            done
          '
          timeout 180 bash -c '
            until rostopic list 2>/dev/null | grep -q /fastlio/cloud_registered; do
              sleep 3
            done
          '
          sleep 20

      - name: Exercise mapping, planning, control and dynamic avoidance
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash

          # Task 1: keep this motion short so Task 2 starts from a predictable,
          # open position while still visibly demonstrating forward and turn.
          timeout 8 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.12}, angular: {z: 0.0}}' || true
          timeout 5 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.0}, angular: {z: 0.45}}' || true
          timeout 6 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.12}, angular: {z: 0.0}}' || true

          # Task 2: create the obstacle before sending the goal. It starts
          # about 1.8 m ahead of the robot, leaving real free space on both
          # sides, so DWA can select and execute a collision-free bypass.
          rosrun exam_bringup obstacle_demo.py move \
            --x 4.3 --y 2.6 --axis y --range 0.4 --speed 0.12 --duration 90 \
            >logs/dynamic-obstacle.log 2>&1 &
          echo $! > logs/obstacle.pid
          sleep 3
          rostopic pub -1 /move_base_simple/goal geometry_msgs/PoseStamped \
            "{header: {frame_id: 'map'}, pose: {position: {x: 6.2, y: 2.6, z: 0.0}, orientation: {w: 1.0}}}"

          # This is an external acceptance observer only. Navigation still
          # uses FAST-LIO2, LaserScan and costmaps; Gazebo truth is never fed
          # back into localization or planning.
          timeout 95 python3 -u - <<'PY' | tee artifacts/dynamic-avoidance.json
          import json
          import math
          import pathlib
          import sys
          import time

          import rospy
          from gazebo_msgs.msg import ModelStates
          from nav_msgs.msg import Odometry

          robot = None
          obstacle = None
          obstacle_samples = 0
