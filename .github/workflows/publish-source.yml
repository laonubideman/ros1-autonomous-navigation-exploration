name: Publish source tree

on:
  push:
    paths:
      - .github/workflows/publish-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source archive
        run: unzip -o -q ros1-workspace-source.zip
      - name: Commit browsable source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish ROS1 workspace source tree"
          git push
