name: ROS1 full four-room acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-run-record-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: osrf/ros:noetic-desktop-full
      options: --privileged --shm-size=2g
    env:
      DEBIAN_FRONTEND: noninteractive
      DISPLAY: :99
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_MASTER_URI: http://localhost:11311
      ROS_HOSTNAME: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Record runner identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts logs
          {
            echo "runner_arch=$(uname -m)"
            echo "ubuntu=$(lsb_release -ds)"
            echo "ros_distro=${ROS_DISTRO:-unknown}"
            echo "commit=${GITHUB_SHA}"
            echo "acceptance=four rooms visited and each coverage >= 0.95"
          } | tee artifacts/environment.txt

      - name: Install build, simulation and recording dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-noetic-move-base ros-noetic-dwa-local-planner \
            ros-noetic-global-planner ros-noetic-map-server \
            ros-noetic-velodyne-gazebo-plugins \
            ros-noetic-pcl-ros ros-noetic-eigen-conversions \
            ros-noetic-teleop-twist-keyboard \
            build-essential cmake pkg-config \
            python3-dev python3-rospkg python3-numpy python3-scipy \
            libpcl-dev libeigen3-dev libboost-all-dev libapr1-dev \
            xvfb x11-utils ffmpeg

      - name: Build the complete catkin workspace
        shell: bash
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee logs/cloud-build.log

      - name: Start virtual display and continuous RViz recording
        shell: bash
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >logs/xvfb.log 2>&1 &
          echo $! > logs/xvfb.pid
          sleep 3
          xdpyinfo -display :99 >/dev/null
          ffmpeg -y -nostdin -f x11grab -framerate 10 -video_size 1280x720 \
            -i :99 -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p \
            artifacts/ros1-full-four-room-acceptance.mp4 >logs/ffmpeg.log 2>&1 &
          echo $! > logs/ffmpeg.pid

      - name: Launch Gazebo, FAST-LIO2, map, navigation and RViz
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          roslaunch exam_fastlio fastlio_navigation.launch rviz:=true \
            >logs/fastlio-navigation.log 2>&1 &
          echo $! > logs/navigation.pid
          timeout 180 bash -c '
            until rosnode list 2>/dev/null | grep -q /laserMapping; do
              sleep 3
            done
          '
          timeout 180 bash -c '
            until rostopic list 2>/dev/null | grep -q /fastlio/cloud_registered; do
              sleep 3
            done
          '
          sleep 20

      - name: Exercise mapping, planning, control and dynamic avoidance
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash

          timeout 12 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.15}, angular: {z: 0.0}}' || true
          timeout 8 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.0}, angular: {z: 0.45}}' || true
          timeout 10 rostopic pub -r 10 /cmd_vel geometry_msgs/Twist \
            '{linear: {x: 0.15}, angular: {z: 0.0}}' || true

          rostopic pub -1 /move_base_simple/goal geometry_msgs/PoseStamped \
            "{header: {frame_id: 'map'}, pose: {position: {x: 5.5, y: 2.0, z: 0.0}, orientation: {w: 1.0}}}"
          sleep 12

          rosrun exam_bringup obstacle_demo.py move \
            --x 4.0 --y 2.0 --axis y --range 1.0 --speed 0.30 --duration 30 \
            >logs/dynamic-obstacle.log 2>&1 || true

          rostopic pub -1 /move_base/cancel actionlib_msgs/GoalID \
            '{stamp: {secs: 0, nsecs: 0}, id: ""}'
          sleep 5

          roslaunch exam_fastlio exploration.launch \
            >logs/exploration.log 2>&1 &
          echo $! > logs/exploration.pid
          timeout 60 rostopic echo -n 1 /exploration/status \
            | tee artifacts/exploration-first-status.txt

      - name: Run runtime acceptance verifier
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          {
            echo "=== ROS nodes ==="
            rosnode list
            echo
            echo "=== ROS topics ==="
            rostopic list
            echo
            echo "=== Runtime verifier ==="
            python3 verify_runtime.py
          } 2>&1 | tee artifacts/runtime-acceptance.txt

      - name: Wait up to 20 minutes for strict four-room completion
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          python3 -u - <<'PY' 2>&1 | tee artifacts/four-room-progress.jsonl
          import json
          import pathlib
          import sys
          import threading
          import time

          import rospy
          from std_msgs.msg import String

          latest = None
          lock = threading.Lock()

          def receive(message):
              global latest
              with lock:
                  latest = message.data

          rospy.init_node('strict_four_room_acceptance', anonymous=True, disable_signals=True)
          rospy.Subscriber('/exploration/status', String, receive, queue_size=1)
          timeout_seconds = 1200
          deadline = time.monotonic() + timeout_seconds
          previous = None
          last_print = 0.0
          final = None

          while time.monotonic() < deadline and not rospy.is_shutdown():
              with lock:
                  raw = latest
              if raw:
                  try:
                      status = json.loads(raw)
                  except json.JSONDecodeError:
                      status = None
                  if status is not None:
                      rooms = status.get('rooms', [])
                      summary = {
                          'elapsed_seconds': round(timeout_seconds - (deadline - time.monotonic()), 1),
                          'state': status.get('state'),
                          'active_room': status.get('active_room'),
                          'completed_rooms': status.get('completed_rooms'),
                          'sent': status.get('sent'),
                          'succeeded': status.get('succeeded'),
                          'failed': status.get('failed'),
                          'rooms': rooms,
                      }
                      signature = json.dumps({key: value for key, value in summary.items()
                                              if key != 'elapsed_seconds'}, ensure_ascii=False, sort_keys=True)
                      if signature != previous or time.monotonic() - last_print >= 15:
                          encoded = json.dumps(summary, ensure_ascii=False, sort_keys=True)
                          print(encoded, flush=True)
                          previous = signature
                          last_print = time.monotonic()
                      expected = {'A', 'B', 'C', 'D'}
                      room_ids = {room.get('id') for room in rooms}
                      rooms_ok = (
                          room_ids == expected
                          and all(room.get('visited') is True for room in rooms)
                          and all(float(room.get('coverage', 0.0)) >= 0.95 for room in rooms)
                          and all(room.get('complete') is True for room in rooms)
                      )
                      if (
                          status.get('state') == 'complete'
                          and status.get('active_room') is None
                          and status.get('completed_rooms') == 4
                          and rooms_ok
                      ):
                          final = status
                          break
              time.sleep(0.5)

          if final is None:
              print('FAIL: strict four-room completion was not reached within 1200 seconds.', flush=True)
              sys.exit(1)

          output = pathlib.Path('artifacts/four-room-final-status.json')
          output.write_text(json.dumps(final, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          print('PASS: A, B, C and D were visited; every room reached stable coverage >= 0.95.', flush=True)
          PY

      - name: Finish recording and collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f logs/ffmpeg.pid ]]; then
            ffmpeg_pid="$(cat logs/ffmpeg.pid)"
            kill -INT "$ffmpeg_pid" 2>/dev/null
            for attempt in $(seq 1 20); do
              kill -0 "$ffmpeg_pid" 2>/dev/null || break
              sleep 1
            done
            kill -TERM "$ffmpeg_pid" 2>/dev/null || true
          fi
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash 2>/dev/null
          timeout 15 rostopic echo -n 1 /exploration/status \
            >artifacts/exploration-last-status.txt 2>&1
          rosnode list >artifacts/rosnodes.txt 2>&1
          rostopic list >artifacts/rostopics.txt 2>&1
          cp upstream_versions.json artifacts/
          cp logs/*.log artifacts/ 2>/dev/null

      - name: Upload full video, strict result, report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros1-full-four-room-acceptance
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
